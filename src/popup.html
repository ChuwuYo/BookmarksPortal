<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#58505b" />
    <title>书签传送门-BookmarksPortal</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="container" class="container loading">
      <header class="header-controls">
        <button
          id="loadOptionsButton"
          type="button"
          class="icon-btn"
          data-i18n-aria="loadOptions"
          data-i18n-title="loadOptions"
          aria-label="加载上次选择"
          title="加载上次选择"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
        <h1 id="title" data-i18n="title">选择要导出的书签</h1>
        <button
          id="languageToggle"
          type="button"
          class="icon-btn"
          data-i18n-aria="switchLanguage"
          data-i18n-title="switchLanguage"
          aria-label="切换语言"
          title="切换语言"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m5 8 6 6"></path>
            <path d="m4 14 6-6 2-3"></path>
            <path d="M2 5h12"></path>
            <path d="M7 2h1"></path>
            <path d="m22 22-5-10-5 10"></path>
            <path d="M14 18h6"></path>
          </svg>
        </button>
      </header>

      <input
        id="searchInput"
        type="search"
        class="search-input"
        data-i18n-placeholder="searchPlaceholder"
        data-i18n-aria="searchLabel"
        placeholder="搜索书签…"
        aria-label="搜索书签"
      />

      <div id="bookmarkList" class="bookmark-tree" role="tree" aria-label="Bookmark tree"></div>

      <p id="selectionCount" class="selection-count" aria-live="polite"></p>
      <p id="statusBar" class="status-bar" role="status" aria-live="polite" hidden></p>

      <footer class="controls">
        <div class="button-group">
          <button id="selectAll" class="btn secondary" type="button" data-i18n="selectAll">
            全选
          </button>
          <button id="deselectAll" class="btn secondary" type="button" data-i18n="deselectAll">
            全不选
          </button>
          <button id="exportButton" class="btn primary" type="button" data-i18n="exportButton">
            导出书签
          </button>
        </div>
      </footer>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
